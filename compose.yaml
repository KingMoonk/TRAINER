# Development on the tailnet: the API and the Next dev server run the source in this checkout (bind-mounted, hot
# reloading), and a Tailscale container puts them on the tailnet as one HTTPS URL. See docs/dev-compose.md.
#   cp docker/.env.example .env   # then set TS_AUTHKEY
#   docker compose up
name: groundwork

services:
  tailscale:
    image: tailscale/tailscale:v1.90.6
    hostname: ${TS_HOSTNAME:-groundwork-dev}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env (docs/dev-compose.md)}
      TS_HOSTNAME: ${TS_HOSTNAME:-groundwork-dev}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/serve.json:/config/serve.json:ro
    restart: unless-stopped

  # The API and the web app share the tailscale container's network, so `tailscale serve` reaches them on 127.0.0.1 and
  # nothing listens on the host. The API binds 127.0.0.1: only `tailscale serve` (which adds Tailscale-User-Login) can
  # reach it.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    network_mode: service:tailscale
    working_dir: /app
    command: python -m studio_api --reload --bind 127.0.0.1 ${API_ARGS:-}
    volumes:
      - .:/app
    depends_on:
      tailscale: {condition: service_started, restart: true}  # a new tailscale container is a new network
    restart: unless-stopped

  web:
    image: node:24-slim
    network_mode: service:tailscale
    working_dir: /app/web
    environment:
      NEXT_PUBLIC_API_URL: /api  # same origin: `tailscale serve` sends /api/* to the API with the prefix stripped
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --store-dir /pnpm-store && pnpm dev --hostname 127.0.0.1 --port 3000"
    volumes:
      - ./web:/app/web
      - web-node-modules:/app/web/node_modules  # Linux builds of the native packages, apart from the host's
      - web-next:/app/web/.next
      - pnpm-store:/pnpm-store  # outside web/, which is the host's checkout
    depends_on:
      tailscale: {condition: service_started, restart: true}  # a new tailscale container is a new network
    restart: unless-stopped

volumes:
  tailscale-state:
  web-node-modules:
  web-next:
  pnpm-store:
