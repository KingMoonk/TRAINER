name: Nightly

# The slow, platform-specific tier: unit tests and the real training run on macOS and Windows, and the web e2e flows in WebKit. Pull requests run the
# Linux job in ci.yml instead (macOS minutes bill at 10x and Windows at 2x on a private repo).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # ruff, compileall, unit tests and the real training run, in that order; see tasks.py
      - run: python tasks.py test:ci:e2e
        timeout-minutes: 20  # the Windows unit suite alone was ~10 min (2100 tests) and is growing
      # a native crash (exit 245/246) leaves its C stack only in the macOS crash report
      - if: failure() && runner.os == 'macOS'
        run: |
          sleep 15
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do [ -e "$f" ] && { echo "== $f"; cat "$f"; }; done
      # Windows: the Application log names the faulting module (torch_cpu.dll, say) and the exception code of a native crash
      - if: failure() && runner.os == 'Windows'
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error','Windows Error Reporting'; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message
  web-webkit:
    # The e2e flows on Safari's engine. Pull requests run them on Chromium only (web job in ci.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0; the pnpm version comes from web/package.json
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec playwright test --project=webkit
        env:
          WEBKIT: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-webkit
          path: web/playwright-report
