name: CI

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # catches syntax errors in modules no test imports
      - run: python -m compileall -q .
      # test_gui skips itself when no display is available; test_gpu skips without CUDA
      - run: python -m unittest discover -s tests
