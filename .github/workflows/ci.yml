name: CI

# macOS minutes bill at 10x and Windows at 2x on a private repo, so: one run per change, none for docs; the macOS and Windows runs are nightly.yml
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  # Every PR runs, docs-only ones too: unit, web, secrets and title are required checks, and a skipped run never reports them.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the unit tests in four parallel shards (tasks.py test:ci --shard i/4): every test module runs in exactly one, compileall and ruff in shard 1
  unit-shard:
    name: unit ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
            requirements-dev.txt
      # the CPU torch wheel: the default one on Linux pulls in the CUDA libraries (gigabytes) that a runner cannot use
      - run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      # see tasks.py. macOS and Windows run the whole of test:ci:e2e nightly, unsharded (nightly.yml).
      - run: python tasks.py test:ci --shard ${{ matrix.shard }}/4

  # the check the main branch ruleset requires: green only when every shard is
  unit:
    needs: unit-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.unit-shard.result }}" = success

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0; the pnpm version comes from web/package.json
        with:
          package_json_file: web/package.json  # the default is the repo root
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # web/src/lib/api-schema.ts is generated from the committed web/openapi.json; tests/test_api_schema.py checks that file
      - run: pnpm gen:api
      - run: git diff --exit-code -- src/lib/api-schema.ts
      - run: pnpm lint
      - run: pnpm typecheck
      # unit, component and contract tests (Vitest, jsdom); no browser. The contract fixtures are checked for staleness by `python tasks.py test` in the unit job.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # the live test runs `python -m studio_api --fake`, which imports the engine (torch): install the CPU wheel, not the CUDA one
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ../requirements.txt
      # the e2e flows (Playwright, Chromium) against web/out, plus the live specs against `studio_api --fake`
      - run: pnpm test:e2e
        env:
          API_LIVE: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # the action lists the pull request's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the pushed commits, so it needs history
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
