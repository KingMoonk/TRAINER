name: CI

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # software OpenGL (Mesa on Windows) so the 3D viewer tests run without a GPU
      - uses: pyvista/setup-headless-display-action@v3
      - run: python -m ruff check .
      # catches syntax errors in modules no test imports
      - run: python -m compileall -q .
      # only test_gpu should skip here (no CUDA); -v lists every test so a skip is visible in the log
      - run: python -m unittest discover -s tests -v
      # real training run on a committed sample (about 1 s of compute)
      - run: python -m unittest tests.e2e_train -v
        timeout-minutes: 5
      # real watchdog + trainer processes: kill, pause/resume, finish on a 75 s time limit; installs and removes the real sign-in entry (CI is set)
      - run: python -m unittest tests.e2e_passive -v
        timeout-minutes: 10
