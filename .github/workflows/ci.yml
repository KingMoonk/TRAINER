name: CI

# macOS minutes bill at 10x and Windows at 2x on a private repo, so: one run per change, none for docs
on:
  push:
    branches: [wedd-compute-cluster, master]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # a hung Tk test would otherwise run for the 6 hour default
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # software OpenGL (Mesa on Windows) so the 3D viewer tests run without a GPU
      - uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79  # v5.1.0
      # compileall, ruff, unit tests, window tests (gui_*.py) and the real training run, in that order; see tasks.py
      - run: python tasks.py test:ci:e2e
        timeout-minutes: 12
      # a native crash (exit 245/246) leaves its C stack only in the macOS crash report
      - if: failure() && runner.os == 'macOS'
        run: |
          sleep 15
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do [ -e "$f" ] && { echo "== $f"; cat "$f"; }; done
      # Windows: the Application log names the faulting module (torch_cpu.dll, say) and the exception code of a native crash
      - if: failure() && runner.os == 'Windows'
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error','Windows Error Reporting'; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0; the pnpm version comes from web/package.json
        with:
          package_json_file: web/package.json  # the default is the repo root
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # web/src/lib/api-schema.ts is generated from the committed web/openapi.json; tests/test_api_schema.py checks that file
      - run: pnpm gen:api
      - run: git diff --exit-code -- src/lib/api-schema.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # the live test runs `python -m studio_api --fake`, which imports the engine (torch): install the CPU wheel, not the CUDA one
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ../requirements.txt
      - run: pnpm test
        env:
          API_LIVE: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # the action lists the pull request's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the pushed commits, so it needs history
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
