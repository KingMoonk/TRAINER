name: close-issues

# GitHub only honours "Closes #N" for PRs merged into the default branch (master).
# PRs into the base branch, wedd-compute-cluster, close their issues here instead.
on:
  pull_request:
    types: [closed]
    branches: [wedd-compute-cluster]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Close the issues the PR says it closes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$TEXT" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un \
            | while read -r n; do
                gh issue close "$n" --repo "$REPO" --reason completed \
                  --comment "Closed by #$PR, merged into wedd-compute-cluster." || true
              done
