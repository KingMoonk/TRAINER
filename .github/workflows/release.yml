name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # builds and uploads the workflow artifacts only; no release

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, name: macos}
          - {os: windows-latest, name: windows}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller  # PyInstaller is build-only, so it stays out of requirements.txt
      - run: python -m unittest tests.test_module_packaging -v
      # studio_brain3d is only ever launched by name (the 3D viewer), so the import scan cannot see it
      - run: python -m PyInstaller app.py --name Groundwork --windowed --noconfirm --clean --additional-hooks-dir packaging --hidden-import studio_brain3d --hidden-import studio_worker
      - name: Zip (macOS)
        if: matrix.name == 'macos'
        run: ditto -c -k --keepParent dist/Groundwork.app Groundwork-macos.zip
      - name: Zip (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Groundwork -DestinationPath Groundwork-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Groundwork-${{ matrix.name }}
          path: Groundwork-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and attach the zips
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/Groundwork-macos.zip dist/Groundwork-windows.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
