name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # builds and uploads the workflow artifacts only; no release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_release_workflow -v
      # the API serves web/out, so the release needs it built and packaged
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0; the pnpm version comes from web/package.json
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: Package source and web assets
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          root = Path(".")
          archive = Path("Groundwork.zip")
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(root.glob("*.py")):
                  zf.write(p, p.as_posix())
              for p in sorted(root.glob("requirements*.txt")):
                  zf.write(p, p.as_posix())
              for name in ("README.md", "CLAUDE.md", "ruff.toml"):
                  p = root / name
                  if p.is_file():
                      zf.write(p, p.as_posix())
              for folder in ("studio_api", "studio_collect", "studio_ia", "studio_modules"):
                  for p in sorted((root / folder).rglob("*")):
                      if p.is_file() and "__pycache__" not in p.parts and not p.name.endswith(".pyc"):
                          zf.write(p, p.as_posix())
              for p in sorted((root / "web" / "out").rglob("*")):
                  if p.is_file():
                      zf.write(p, p.as_posix())
      - name: Smoke test unpacked release
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, zipfile

          with tempfile.TemporaryDirectory() as tmpdir:
              with zipfile.ZipFile("Groundwork.zip") as zf:
                  zf.extractall(tmpdir)
              report = pathlib.Path(tmpdir) / "smoke-report.txt"
              try:
                  code = subprocess.run([sys.executable, "app.py", "--smoke", str(report)], cwd=tmpdir, timeout=180).returncode
              except subprocess.TimeoutExpired:
                  code = "timed out after 180s"
              text = report.read_text(encoding="utf-8") if report.exists() else "(no report written: the app crashed before it could)"
              print(text)
              if code != 0 or not text.endswith("OK\n"):
                  sys.exit(f"smoke test failed (exit {code})")
      - uses: actions/upload-artifact@v7
        with:
          name: Groundwork
          path: Groundwork.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and attach the zip
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/Groundwork.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
